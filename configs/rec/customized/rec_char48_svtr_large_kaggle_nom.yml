Global:
  debug: False
  use_gpu: true
  distributed: true
  epoch_num: 40
  log_smooth_window: 20
  print_batch_step: 20
  pretrained_model: /kaggle/temp/weights/latest
  # checkpoints: /kaggle/temp/weights/latest
  save_model_dir: /kaggle/working/rec
  save_epoch_step: 2
  eval_batch_step: [0, 3000]
  character_dict_path: ppocr/utils/dict/new_nom_dict.txt
  char_num: &char_num 1754
  max_text_length: &max_text_length 1
  use_space_char: false
  image_shape: [3, 48, 48]
  infer_mode: false
  save_res_path: ./output/rec/predicts_svtr_large_kaggle_nom.txt
  use_amp: true  # Mixed precision for memory efficiency

Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.99
  epsilon: 1.0e-08
  weight_decay: 0.05
  no_weight_decay_name: norm pos_embed char_node_embed pos_node_embed char_pos_embed vis_pos_embed
  one_dim_param_no_weight_decay: true
  lr:
    name: Cosine
    learning_rate: 0.0004  # Balanced learning rate
    warmup_epoch: 8

Architecture:
  model_type: rec
  algorithm: SVTR
  Transform: null    
  Backbone:
    name: SVTRNet
    img_size: [48, 48]
    out_char_num: 12  # W//4 = 48//4 = 12 (used by avg_pool when last_stage=True)
    out_channels: 320  # Kaggle-optimized (between Base 256 and Large 384)
    patch_merging: Conv
    embed_dim: [160, 256, 384]  # Kaggle-optimized dimensions
    depth: [3, 6, 8]  # More accurate to SVTR pattern, but reduced for memory
    num_heads: [5, 8, 12]  # Balanced attention heads
    mixer: ['Local','Local','Local','Local','Local','Local','Local','Local','Global','Global','Global','Global','Global','Global','Global','Global','Global']  # 8 Local + 9 Global = 17 layers (memory optimized)
    local_mixer: [[5, 5], [5, 5], [5, 5]]  # SVTR standard
    last_stage: True  # Required for proper out_channels control
    prenorm: True  # Better training stability
    sub_num: 2
    drop_path_rate: 0.15  # Added regularization
  Head:
    name: CTCHeadTLast
    in_channels: 320  # Match the backbone out_channels when last_stage=True
    fc_decay: 1.0e-5
    out_channels: *char_num

Loss:
  name: CTCLoss

PostProcess:  
  name: CTCLabelDecodeTopK
  character_dict_path: ppocr/utils/dict/new_nom_dict.txt
  use_space_char: false
  k: 5

Metric:
  name: RecMetricTopK
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/temp/extracted_data
    ext_op_transform_idx: 1
    label_file_list:
      # - ./train_labels/converted_casia_hwdb_train.txt
      - ./train_labels/nom_train_data_unicode.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.3  # Slightly increased for better generalization
        ext_data_num: 2
        image_shape: [48, 48, 3]
    - RecAug:
    - CTCLabelEncode:
    - SVTRRecResizeImg:
        image_shape: [3, 48, 48]
        pad: false
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: true
    batch_size_per_card: 192  # Kaggle-optimized batch size
    drop_last: true
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/temp/extracted_data
    label_file_list:
      # - ./train_labels/converted_casia_hwdb_test.txt
      - ./train_labels/nom_test_data_unicode.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode:
    - SVTRRecResizeImg:
        image_shape: [3, 48, 48]
        pad: false
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 192
    num_workers: 2 