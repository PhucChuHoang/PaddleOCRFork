Global:
  debug: False
  use_gpu: true
  distributed: true
  epoch_num: 40
  log_smooth_window: 20
  print_batch_step: 20
  # pretrained_model: /kaggle/temp/weights/latest
  # checkpoints: /kaggle/temp/weights/latest
  save_model_dir: /kaggle/working/rec
  save_epoch_step: 2
  eval_batch_step: [0, 3000]
  character_dict_path: ppocr/utils/dict/casia_hwdb_dict.txt
  char_num: &char_num 10852
  max_text_length: &max_len 1
  use_space_char: false
  image_shape: [3, 48, 48]
  infer_mode: false
  save_res_path: ./output/rec/predicts_svtr_large_full_nom.txt

Optimizer:
  name: AdamW
  beta1: 0.9
  beta2: 0.99
  epsilon: 1.0e-08
  weight_decay: 0.05
  no_weight_decay_name: norm pos_embed char_node_embed pos_node_embed char_pos_embed vis_pos_embed
  one_dim_param_no_weight_decay: true
  lr:
    name: Cosine
    learning_rate: 0.0003  # Reduced for stability with larger model
    warmup_epoch: 8

Architecture:
  model_type: rec
  algorithm: SVTR
  Transform: null    
  Backbone:
    name: SVTRNet
    img_size: [48, 48]
    out_char_num: 12  # W//4 = 48//4 = 12 (this will be used by avg_pool when last_stage=True)
    out_channels: 384  # Official SVTR Large specification from research paper
    patch_merging: Conv
    embed_dim: [192, 256, 512]  # Official SVTR Large embed dimensions
    depth: [3, 9, 9]  # Official SVTR Large depth
    num_heads: [6, 8, 16]  # Official SVTR Large attention heads
    mixer: ['Local','Local','Local','Local','Local','Local','Local','Local','Local','Local','Global','Global','Global','Global','Global','Global','Global','Global','Global','Global','Global']  # Official: 10 Local + 11 Global = 21 layers
    local_mixer: [[5, 5], [5, 5], [5, 5]]  # SVTR Large local mixer
    last_stage: True  # Required for out_channels=384 as per research paper
    prenorm: True  # SVTR Large uses prenorm
    sub_num: 2
  Head:
    name: CTCHeadTLast
    in_channels: 384  # Match backbone out_channels when last_stage=True
    fc_decay: 1.0e-5
    out_channels: *char_num

Loss:
  name: CTCLoss

PostProcess:  
  name: CTCLabelDecodeTopK
  character_dict_path: ppocr/utils/dict/casia_hwdb_dict.txt
  use_space_char: false
  k: 5

Metric:
  name: RecMetricTopK
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/temp/extracted_data
    ext_op_transform_idx: 1
    label_file_list:
      - ./train_labels/converted_casia_hwdb_train.txt
      # - ./train_labels/nom_train_data_unicode.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.25
        ext_data_num: 2
        image_shape: [48, 48, 3]
    - RecAug:
    - CTCLabelEncode:
    - SVTRRecResizeImg:
        image_shape: [3, 48, 48]
        pad: false
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: true
    batch_size_per_card: 128  # Significantly reduced due to SVTR Large memory requirements
    drop_last: true
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/temp/extracted_data
    label_file_list:
      - ./train_labels/converted_casia_hwdb_test.txt
      # - ./train_labels/nom_test_data_unicode.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode:
    - SVTRRecResizeImg:
        image_shape: [3, 48, 48]
        pad: false
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 2 