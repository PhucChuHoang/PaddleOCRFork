Global:
  debug: False
  use_gpu: true
  distributed: true
  epoch_num: 40
  log_smooth_window: 20
  print_batch_step: 20
  pretrained_model: /kaggle/temp/weights/latest
  # checkpoints: /kaggle/temp/weights/latest
  save_model_dir: /kaggle/working/rec
  save_epoch_step: 2
  eval_batch_step: [0, 5000]
  character_dict_path: ppocr/utils/dict/new_nom_dict.txt
  char_num: &char_num 2059
  max_text_length: &max_len 1
  use_space_char: false
  image_shape: [3, 48, 48]
  infer_mode: false
  save_res_path: ./output/rec/predicts_rcnn_bilstm_ctc.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 5
  regularizer:
    name: 'L2'
    factor: 1e-4

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform: null    # No TPS needed for single characters
  Backbone:
    name: ResNet
    layers: 34
    use_se: false
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 256
    bidirectional: true
    rnn_type: LSTM
  Head:
    name: CTCHead
    fc_decay: 1.0e-5
    out_channels: *char_num

Loss:
  name: CTCLoss

PostProcess:  
  name: CTCLabelDecodeTopK
  character_dict_path: ppocr/utils/dict/new_nom_dict.txt
  use_space_char: false
  k: 5

Metric:
  name: RecMetricTopK
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/temp/extracted_data
    ext_op_transform_idx: 1
    label_file_list:
      # - ./train_labels/converted_casia_hwdb_train.txt
      # - ./train_labels/nom_train_data_unicode.txt
      - ./train_labels/new_nom_train_data_paddleocr.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.25
        ext_data_num: 2
        image_shape: [48, 48, 3]
    - RecAug:
    - CTCLabelEncode:
    - RecResizeImg:
        image_shape: [3, 48, 48]
        infer_mode: false
        character_dict_path: ppocr/utils/dict/new_nom_dict.txt
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: true
    batch_size_per_card: 256
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/temp/extracted_data
    label_file_list:
      # - ./train_labels/converted_casia_hwdb_test.txt
      # - ./train_labels/nom_test_data_unicode.txt
      - ./train_labels/new_nom_test_data_paddleocr.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode:
    - RecResizeImg:
        image_shape: [3, 48, 48]
        infer_mode: false
        character_dict_path: ppocr/utils/dict/new_nom_dict.txt
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256    
    num_workers: 2